<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ética na Inteligência Artificial — Baralho</title><style>
*{box-sizing:border-box}body{margin:0;background:#061018;color:#eef7ff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1540px;margin:auto;padding:28px}.hero{text-align:center;margin-bottom:24px}.hero h1{margin:0;font-size:32px;letter-spacing:.06em}.hero p{color:#9fb1bf;margin:6px 0}.groupchip{display:inline-flex;margin-top:10px;padding:7px 13px;border:1px solid #2c4d65;border-radius:999px;color:#bde4ff;background:#0b1b27;font-weight:800;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.deck{min-width:0;text-decoration:none;color:#fff;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 24%,#07121c),#07121c 68%);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-radius:16px;padding:22px;box-shadow:inset 0 0 30px color-mix(in srgb,var(--c) 8%,transparent);transition:.2s;position:relative}.deck:not(.locked):hover{transform:translateY(-2px);box-shadow:0 12px 30px #0008,inset 0 0 35px color-mix(in srgb,var(--c) 12%,transparent)}.deck.locked{filter:saturate(.35);opacity:.58;cursor:not-allowed}.locktag{position:absolute;right:14px;top:14px;padding:5px 9px;border-radius:999px;background:#050b10aa;border:1px solid #ffffff22;font-size:11px;font-weight:800}.deckhead{display:flex;gap:12px;min-height:150px}.ico{font-size:46px;line-height:1;color:var(--c);width:58px;text-align:center}small{color:var(--c);font-weight:800;letter-spacing:.16em}h2{margin:2px 0 4px;font-size:24px;color:color-mix(in srgb,var(--c) 78%,white)}p{margin:0;color:#e2e8ec;font-size:14px;line-height:1.35}footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:12px;color:#b8c7d0}footer strong{border:1px solid var(--c);border-radius:999px;padding:6px 10px;color:var(--c);font-size:10px;letter-spacing:.06em}.submitbar{margin-top:20px;border:1px solid #203c50;background:#081722;border-radius:16px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.progress{font-size:13px;color:#a9bdc9}.progress b{color:#eef7ff}.submitactions{display:flex;gap:9px}.submitactions button{border:1px solid #28a8ff;background:#0b1d2a;color:#cdeeff;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.submitactions button:disabled{opacity:.35;cursor:not-allowed}.msg{font-size:12px;color:#9fb1bf;margin-top:8px}.errorbox{display:none;margin:20px 0;padding:16px;border:1px solid #ff6b6b66;background:#3a101055;border-radius:12px;color:#ffd6d6}@media(max-width:1150px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){main{padding:14px}.grid{grid-template-columns:1fr}.hero h1{font-size:25px}}
</style></head><body><main><div class="hero"><h1>ÉTICA NA INTELIGÊNCIA ARTIFICIAL</h1><p>Baralho de investigação ética · 8 decks · 64 cartas</p><span class="groupchip" id="groupchip">IDENTIFICANDO GRUPO…</span></div><div class="errorbox" id="errorbox"></div><div class="grid" id="grid"></div><section class="submitbar" id="submitbar" hidden><div><b>Enviar cartas escolhidas</b><div class="progress" id="progress"></div><div class="msg" id="msg">É necessário selecionar pelo menos 2 cartas em cada deck liberado do encontro.</div></div><div class="submitactions"><button id="send1" disabled>ENVIAR ENCONTRO 1</button><button id="send2" disabled>ENVIAR ENCONTRO 2</button></div></section></main><script>
const META=[
{id:1,file:'01-representar.html',title:'REPRESENTAR',desc:'O que é visto, quem é incluído, o que fica de fora?',ico:'◎',c:'#28a8ff',phase:1,short:'R'},
{id:2,file:'02-classificar.html',title:'CLASSIFICAR',desc:'Como os dados são organizados e rotulados?',ico:'▦',c:'#c04cff',phase:1,short:'C'},
{id:3,file:'03-hierarquizar.html',title:'HIERARQUIZAR',desc:'O que é considerado mais importante e por quê?',ico:'▲',c:'#ff3f78',phase:1,short:'H'},
{id:4,file:'04-extrair.html',title:'EXTRAIR',desc:'Que informações são coletadas, com que finalidade?',ico:'◉',c:'#48e38a',phase:1,short:'E'},
{id:5,file:'05-decidir.html',title:'DECIDIR',desc:'Como as decisões são tomadas e o que é automatizado?',ico:'↗',c:'#ff8b32',phase:2,short:'D'},
{id:6,file:'06-consequencias.html',title:'CONSEQUÊNCIAS',desc:'Quais impactos são gerados e sobre quem?',ico:'◎',c:'#ffd42a',phase:2,short:'CO'},
{id:7,file:'07-responder.html',title:'RESPONDER',desc:'Quem é responsável e como prestar contas?',ico:'◯',c:'#23d5ff',phase:2,short:'RE'},
{id:8,file:'08-manifestar.html',title:'MANIFESTAR',desc:'Que princípios, ações e futuros desejamos construir?',ico:'◁',c:'#dc6cff',phase:2,short:'M'}];
const q=new URLSearchParams(location.search);let token=q.get('token')||localStorage.getItem('group_token');if(q.get('token'))localStorage.setItem('group_token',q.get('token'));
const headers=()=>token?{'X-Group-Token':token}:{};
async function load(){try{const r=await fetch('/api/me',{headers:headers()});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Não foi possível identificar o grupo.');const s=await r.json();groupchip.textContent=s.group;submitbar.hidden=false;grid.innerHTML=META.map(m=>{const d=s.decks.find(x=>x.id===m.id);const locked=!d?.unlocked;return `<a class="deck ${locked?'locked':''}" ${locked?'':'href="/decks/'+m.file+'?token='+encodeURIComponent(token)+'"'} style="--c:${m.c}"><span class="locktag">${locked?'🔒 BLOQUEADO':'🔓 LIBERADO'}</span><div class="deckhead"><div class="ico">${m.ico}</div><div><small>DECK ${m.id}</small><h2>${m.title}</h2><p>${m.desc}</p></div></div><footer><span>${d?.selected_count?d.selected_count+' selecionada(s)':'8 cartas'}</span><strong>${locked?'AGUARDE O PROFESSOR':'ABRIR DECK →'}</strong></footer></a>`}).join('');updateProgress(s);}catch(e){groupchip.textContent='GRUPO NÃO IDENTIFICADO';errorbox.style.display='block';errorbox.innerHTML='<b>Não foi possível identificar o grupo.</b><br>'+e.message+'<br><small>Use novamente o QR Code ou link da sua mesa.</small>';}}
function updateProgress(s){for(const phase of [1,2]){const ds=s.decks.filter(d=>d.phase===phase&&d.unlocked);const ok=ds.length>0&&ds.every(d=>d.selected_count>=2);document.getElementById('send'+phase).disabled=!ok;const labels=ds.map(d=>`${META.find(m=>m.id===d.id).short} ${d.selected_count>=2?'✓':('⚠ '+d.selected_count+'/2')}`);if(phase===1)progress.textContent='Encontro 1: '+(labels.join(' · ')||'nenhum deck liberado')+'  |  Encontro 2: '+(s.decks.filter(d=>d.phase===2&&d.unlocked).map(d=>`${META.find(m=>m.id===d.id).short} ${d.selected_count>=2?'✓':('⚠ '+d.selected_count+'/2')}`).join(' · ')||'nenhum deck liberado');}}
async function submit(phase){const b=document.getElementById('send'+phase);b.disabled=true;msg.textContent='Registrando escolhas…';const r=await fetch('/api/submit/'+phase,{method:'POST',headers:{...headers(),'Content-Type':'application/json'}});const x=await r.json();if(!r.ok){msg.textContent=x.error+(x.missing?' Falta: '+x.missing.join(', '):'');}else{msg.textContent=`✓ ${x.group} · Encontro ${phase} registrado. As escolhas foram salvas.`;}await load();}
send1.onclick=()=>submit(1);send2.onclick=()=>submit(2);load();setInterval(load,5000);
</script></body></html>
